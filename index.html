<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Castle Blaster Journey</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;background:#118cff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#fff}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:#178fff}
#sky{position:absolute;inset:0;background:linear-gradient(#087cf4 0 58%,#63d85c 58% 82%,#b58c5f 82%);transition:background .7s}
#world,#actors,#fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.obj{position:absolute;will-change:transform}
.cloud{font-size:70px;opacity:.52;top:10%}.hill{bottom:17%;width:48vw;height:28vh;border-radius:55% 55% 0 0;background:#3fc15c}
.castle{bottom:17%;width:48vw;height:57vh;border:5px solid #8f3e35;background:repeating-linear-gradient(0deg,#ef7d5d 0 24px,#b64b40 25px 29px);box-shadow:8px 8px #0002}
.castle:before{content:"";position:absolute;left:-5px;right:-5px;top:-31px;height:34px;background:#ef7d5d;clip-path:polygon(0 100%,0 35%,10% 35%,10% 0,22% 0,22% 35%,38% 35%,38% 0,52% 0,52% 35%,68% 35%,68% 0,82% 0,82% 35%,100% 35%,100% 100%)}
.castle.purple{filter:hue-rotate(285deg)}.castle.green{filter:hue-rotate(65deg)}
.win{position:absolute;width:42%;height:34%;border:10px solid #ffc66c;border-radius:45% 45% 5px 5px;background:linear-gradient(#245e89,#102e4c);box-shadow:0 5px #833a32,inset 0 0 18px #000}
.w1{left:5%;top:10%}.w2{right:5%;top:10%}.w3{left:5%;top:53%}.w4{right:5%;top:53%}
.blocks{bottom:17%;width:54vw;height:48vh;background:linear-gradient(90deg,#ff4d70 0 14%,#42ca62 14% 28%,#35a8ff 28% 42%,#ffd24c 42% 56%,#a96bea 56% 70%,#ff8c40 70%);border:5px solid #7d4b8e;box-shadow:8px 8px #0002}
.blocks:before{content:"";position:absolute;left:7%;right:7%;top:18%;height:28%;background:#123a61;border:9px solid #ffd35e;border-radius:8px}
.tree{bottom:13%;font-size:100px}.flower{bottom:14%;font-size:55px}.flag{bottom:18%;font-size:100px}
.grass{position:absolute;left:0;right:0;bottom:12%;height:8%;background:repeating-linear-gradient(135deg,#24a947 0 12px,#43d15e 12px 24px)}
#actors{pointer-events:none}.enemy{position:absolute;width:clamp(92px,18vw,160px);height:clamp(88px,17vw,150px);z-index:15;pointer-events:auto;filter:drop-shadow(0 7px 4px #0005);will-change:transform;animation:appear .14s ease-out}
@keyframes appear{from{scale:.3;opacity:.2}to{scale:1;opacity:1}}
.cap{position:absolute;left:5%;top:2%;width:90%;height:49%;border-radius:55% 55% 36% 36%;background:radial-gradient(circle at 28% 28%,#ffe957 0 12%,transparent 13%),radial-gradient(circle at 72% 34%,#ffe957 0 11%,transparent 12%),linear-gradient(#ff6258,#d93649);border:5px solid #702941}
.face{position:absolute;left:21%;top:39%;width:58%;height:45%;border-radius:44%;background:#ffd09a;border:5px solid #6f3d31}.eye{position:absolute;background:#152039;border-radius:50%}.face .eye{top:22%;width:12%;height:29%}.e1{left:25%}.e2{right:25%}.foot{position:absolute;bottom:1%;width:35%;height:18%;border-radius:50%;background:#704035}.f1{left:10%}.f2{right:10%}
.shell{position:absolute;left:8%;top:18%;width:65%;height:60%;border-radius:50%;background:radial-gradient(circle,#ffe66a 0 13%,#61d15e 14% 39%,#268c55 40%);border:5px solid #1f6445}.head{position:absolute;right:0;top:7%;width:46%;height:43%;border-radius:50%;background:#f7db65;border:5px solid #6e6530}.head .eye{right:21%;top:25%;width:12%;height:22%}.leg{position:absolute;bottom:2%;width:25%;height:25%;border-radius:45%;background:#f7db65;border:4px solid #6e6530}.l1{left:15%}.l2{right:13%}
.spook{position:absolute;inset:0;border-radius:52% 52% 40% 40%;background:#f8fbff;border:5px solid #5c6d94}.spook:after{content:"";position:absolute;left:26%;right:26%;bottom:20%;height:13%;border-radius:0 0 50% 50%;background:#ef5c7b}.spook .eye{top:32%;width:13%;height:20%}.spook .e1{left:27%}.spook .e2{right:27%}
.boss{width:clamp(125px,25vw,220px);height:clamp(115px,23vw,205px);filter:drop-shadow(0 0 17px #ffe44c)}.boss .cap{background:radial-gradient(circle at 28% 28%,#fff06b 0 12%,transparent 13%),radial-gradient(circle at 72% 34%,#fff06b 0 11%,transparent 12%),linear-gradient(#a662ff,#6639ca)}
.hp{position:absolute;top:-13px;left:5%;right:5%;height:10px;border:2px solid white;background:#53101d;border-radius:8px;overflow:hidden}.hp i{display:block;height:100%;background:#ff4b58}
#hud{position:absolute;z-index:35;top:0;left:0;right:0;padding:10px 12px;display:flex;justify-content:space-between;gap:6px;font-weight:1000;font-size:clamp(13px,3.7vw,23px);text-shadow:0 3px #000;background:linear-gradient(#001844e8,transparent);pointer-events:none}#timer{color:#ffe33c}#combo{color:#b9ff92}
#msg{position:absolute;z-index:48;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(38px,11vw,82px);font-weight:1000;text-align:center;text-shadow:0 5px #5a1b78,0 0 15px white;pointer-events:none}
.splat{position:fixed;z-index:50;width:30px;height:30px;border-radius:50%;background:var(--c);pointer-events:none;animation:splat .48s forwards}@keyframes splat{to{opacity:0;transform:translate(var(--x),var(--y)) scale(2)}}
.plus{position:fixed;z-index:52;font-size:clamp(40px,10vw,76px);font-weight:1000;pointer-events:none;text-shadow:0 5px #762891,0 0 11px white;animation:plus .65s forwards}@keyframes plus{to{opacity:0;transform:translateY(-100px) scale(1.4)}}
.screen{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 35%,#3378d6,#101a40 72%)}.hidden{display:none!important}h1{margin:0;font-size:clamp(44px,12vw,90px);text-shadow:0 6px #071229,0 0 26px #5ae9ff}.sub{font-size:clamp(18px,5vw,28px);margin:12px 0 27px}button{border:0;border-radius:18px;padding:17px 32px;font-size:22px;font-weight:1000;background:#ffe03a;color:#172039;box-shadow:0 7px #9c7600}.note{font-size:14px;opacity:.82;margin-top:20px}
</style></head><body><div id="game"><div id="sky"></div><div class="grass"></div><div id="world"></div><div id="actors"></div><div id="fx"></div>
<div id="hud" class="hidden"><span id="zone">CASTLE</span><span id="score">SCORE 0</span><span id="combo"></span><span id="timer">30.0</span></div><div id="msg"></div>
<div id="title" class="screen"><h1>CASTLE BLASTER</h1><div class="sub">JOURNEY 🎯</div><button id="start">GAME START</button><div class="note">止まらず進む30秒！<br>城 → ブロック街 → 草原 → FINAL RUSH</div></div>
<div id="result" class="screen hidden"><h1>FINISH!</h1><div id="final" class="sub"></div><button id="retry">もう一度</button></div></div>
<script>
const $=s=>document.querySelector(s),world=$("#world"),actors=$("#actors"),msg=$("#msg");
let running=false,score=0,combo=0,lastHit=0,endAt=0,startAt=0,raf=0,bgm=0,musicStep=0,spawnClock=0,patternClock=0,bossMade=false;
function AC(){return window._ac||(window._ac=new(AudioContext||webkitAudioContext)())}
function tone(f,d=.06,v=.03,type="square"){try{let a=AC(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
const melody=[523,659,784,659,587,698,880,698,659,784,988,784,698,659,587,659];
function startMusic(){clearInterval(bgm);musicStep=0;bgm=setInterval(()=>{if(running){tone(melody[musicStep%melody.length],.12,.013,"triangle");if(musicStep%4===0)tone(musicStep%8?147:131,.09,.007);musicStep++}},170)}
function buildWorld(){
 world.innerHTML="";
 for(let i=0;i<8;i++)world.insertAdjacentHTML("beforeend",`<div class="obj cloud" data-x="${i*55+10}" data-speed=".16">☁️</div>`);
 for(let i=0;i<9;i++)world.insertAdjacentHTML("beforeend",`<div class="obj hill" data-x="${i*55-20}" data-speed=".34"></div>`);
 let things=[
 [5,'castle'],[62,'castle purple'],[119,'blocks'],[180,'castle green'],[240,'tree'],[275,'blocks'],[338,'tree'],[385,'castle'],[445,'tree'],[485,'blocks'],[545,'castle purple']
 ];
 things.forEach((x,i)=>{let cls=x[1],inner=cls.includes("castle")?'<i class="win w1"></i><i class="win w2"></i><i class="win w3"></i><i class="win w4"></i>':cls==="tree"?"🌳":"";world.insertAdjacentHTML("beforeend",`<div class="obj ${cls}" data-x="${x[0]}" data-speed="1">${inner}</div>`)});
 [35,150,225,315,420,520].forEach((x,i)=>world.insertAdjacentHTML("beforeend",`<div class="obj flower" data-x="${x}" data-speed="1.15">${i%2?"🌸":"🌼"}</div>`));
}
function art(k){if(k==="m")return '<i class="cap"></i><i class="face"><i class="eye e1"></i><i class="eye e2"></i></i><i class="foot f1"></i><i class="foot f2"></i>';if(k==="t")return '<i class="shell"></i><i class="head"><i class="eye"></i></i><i class="leg l1"></i><i class="leg l2"></i>';return '<i class="spook"><i class="eye e1"></i><i class="eye e2"></i></i>'}
function addEnemy(x,y,kind="m",motion="still",boss=false){
 let e=document.createElement("div");e.className="enemy"+(boss?" boss":"");e.innerHTML=art(kind)+(boss?'<span class="hp"><i></i></span>':"");e.dataset.hp=boss?5:1;e.dataset.motion=motion;e.dataset.born=performance.now();e.style.left=x+"%";e.style.top=y+"%";e.onpointerdown=hit;actors.appendChild(e);setTimeout(()=>e.isConnected&&e.remove(),boss?4300:motion==="rush"?1600:1350);return e
}
function pattern(elapsed){
 let phase=elapsed<8500?0:elapsed<16500?1:elapsed<23500?2:3;
 $("#zone").textContent=["BRICK CASTLE","BLOCK TOWN","GREEN FIELD","FINAL RUSH"][phase];
 if(phase===3&&!bossMade){bossMade=true;msg.textContent="FINAL RUSH!";tone(110,.3,.07,"sawtooth");setTimeout(()=>msg.textContent="",600);addEnemy(38,25,"m","boss",true)}
 if(phase===0){let spots=[[8,20],[58,18],[17,54],[69,51]];let p=spots[Math.floor(Math.random()*spots.length)];addEnemy(p[0],p[1],Math.random()<.5?"m":"t")}
 else if(phase===1){let mode=Math.random();if(mode<.5)addEnemy(5+Math.random()*80,18+Math.random()*48,Math.random()<.5?"m":"t","still");else addEnemy(100,25+Math.random()*42,"g","rush")}
 else if(phase===2){let r=Math.random();if(r<.5)addEnemy(5+Math.random()*82,38+Math.random()*35,Math.random()<.5?"m":"t","jump");else addEnemy(100,15+Math.random()*35,"g","rush")}
 else {for(let i=0;i<2;i++)addEnemy(5+Math.random()*82,18+Math.random()*55,Math.random()<.45?"m":Math.random()<.8?"t":"g",Math.random()<.45?"jump":"still")}
}
function hit(ev){if(!running)return;ev.stopPropagation();tone(205,.045,.026);let e=ev.currentTarget,h=+e.dataset.hp-1;e.dataset.hp=h;if(h>0){if(e.querySelector(".hp i"))e.querySelector(".hp i").style.width=(h/5*100)+"%";showPlus(ev,"HIT!");return}
 let now=performance.now();combo=now-lastHit<820?combo+1:1;lastHit=now;let pt=(combo>=10?2:1)*(e.classList.contains("boss")?3:1);score+=pt;$("#score").textContent="SCORE "+score;$("#combo").textContent=combo>2?combo+" COMBO":"";splat(ev);showPlus(ev,"+"+pt);tone(430+Math.min(combo,12)*22,.08,.055,"sine");
 e.animate([{transform:"scale(1) rotate(0)"},{transform:"translateY(-80px) rotate(25deg) scale(.15)",opacity:0}],{duration:260,fill:"forwards"});setTimeout(()=>e.remove(),250)
}
function splat(ev){let cs=["#8c42ff","#ff4878","#36d8ff","#ffe43c","#52e06a"];for(let i=0;i<18;i++){let s=document.createElement("i");s.className="splat";s.style.left=ev.clientX+"px";s.style.top=ev.clientY+"px";s.style.setProperty("--c",cs[i%5]);let a=Math.random()*6.283,d=35+Math.random()*110;s.style.setProperty("--x",Math.cos(a)*d+"px");s.style.setProperty("--y",Math.sin(a)*d+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),520)}}
function showPlus(ev,t){let p=document.createElement("b");p.className="plus";p.textContent=t;p.style.left=(ev.clientX-20)+"px";p.style.top=(ev.clientY-38)+"px";document.body.appendChild(p);setTimeout(()=>p.remove(),680)}
function start(){running=true;score=combo=0;lastHit=0;bossMade=false;actors.innerHTML="";buildWorld();$("#score").textContent="SCORE 0";$("#combo").textContent="";$("#title").classList.add("hidden");$("#result").classList.add("hidden");$("#hud").classList.remove("hidden");startAt=performance.now();endAt=startAt+30000;spawnClock=0;patternClock=0;msg.textContent="GO!";setTimeout(()=>msg.textContent="",450);startMusic();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function loop(now){
 if(!running)return;let elapsed=now-startAt,left=endAt-now;if(left<=0)return finish();$("#timer").textContent=(left/1000).toFixed(1);
 let travel=elapsed*.018;document.querySelectorAll(".obj").forEach(o=>{let x=+o.dataset.x-travel*(+o.dataset.speed);o.style.transform=`translate3d(${x}vw,0,0)`});
 document.querySelectorAll(".enemy").forEach(e=>{let age=now-(+e.dataset.born),m=e.dataset.motion;if(m==="rush")e.style.transform=`translate3d(${-age*.065}vw,${Math.sin(age/120)*18}px,0)`;else if(m==="jump")e.style.transform=`translate3d(0,${-Math.abs(Math.sin(age/210))*55}px,0)`});
 if(now-patternClock>(elapsed>23500?360:elapsed>8500?500:620)){patternClock=now;pattern(elapsed)}
 raf=requestAnimationFrame(loop)
}
function finish(){running=false;clearInterval(bgm);cancelAnimationFrame(raf);actors.innerHTML="";$("#hud").classList.add("hidden");msg.textContent="FINISH!";tone(784,.2,.06,"triangle");setTimeout(()=>{msg.textContent="";$("#result").classList.remove("hidden");$("#final").innerHTML=`SCORE <b style="font-size:2em;color:#ffe03a">${score}</b><br>RANK ${score>=70?"S":score>=48?"A":score>=30?"B":"C"}`},700)}
$("#start").onclick=$("#retry").onclick=start;
let lt=0;["dblclick","gesturestart","gesturechange","gestureend"].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));document.addEventListener("touchend",e=>{let n=Date.now();if(n-lt<400)e.preventDefault();lt=n},{passive:false});
buildWorld();
</script></body></html>
