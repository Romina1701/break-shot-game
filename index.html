<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>BREAK SHOT</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;background:#07101b;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}#game{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:linear-gradient(#58c8ff 0 50%,#74d66a 50%)}#city{position:absolute;inset:0}.sky{position:absolute;inset:0 0 20%;background:linear-gradient(#45bfff,#dff8ff)}.sun{position:absolute;width:85px;height:85px;border-radius:50%;background:#fff3a0;right:8%;top:9%;box-shadow:0 0 40px #fff4aa}.road{position:absolute;bottom:0;width:100%;height:20%;background:#6b78a8;border-top:7px solid #fff3a0}.road:after{content:"";position:absolute;top:50%;width:100%;border-top:6px dashed #f6d55c}.building{position:absolute;bottom:18%;background:linear-gradient(90deg,#ff8a65,#ffd166);border:3px solid #25343e;box-shadow:8px 0 14px #0005}.building.alt{background:linear-gradient(90deg,#8e7dff,#5fd7d7)}.window{position:absolute;background:linear-gradient(#b9efff,#68b9e8);border:4px solid #fff7cf;overflow:hidden;box-shadow:inset 0 0 12px #000}.window:after{content:"";position:absolute;left:50%;height:100%;border-left:2px solid #8ca4af}.actor{position:absolute;inset:0;z-index:3;display:flex;align-items:flex-end;justify-content:center;animation:rise .18s ease-out}.person{font-size:clamp(58px,12vw,105px);line-height:.95;filter:drop-shadow(0 4px 2px #0009)}.cop .person{filter:drop-shadow(0 0 8px #42aaff)}.boss .person{font-size:clamp(70px,14vw,125px);filter:drop-shadow(0 0 10px #f33)}.hp{position:absolute;top:3px;left:8%;right:8%;height:7px;background:#450909;border:1px solid #fff}.hp i{display:block;height:100%;width:100%;background:#ff3535}@keyframes rise{from{transform:translateY(75%)}to{transform:translateY(0)}}#hud{position:absolute;z-index:20;top:0;width:100%;display:flex;justify-content:space-between;padding:10px;background:linear-gradient(#06101ee8,transparent);font-weight:900;font-size:clamp(14px,4vw,23px);text-shadow:0 2px #000;pointer-events:none}#timer{color:#ffd52c}#combo{color:#7effa1}.hidden{display:none!important}.screen{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 35%,#214e75,#07111d 72%)}h1{font-size:clamp(43px,11vw,90px);margin:0;text-shadow:0 5px #080b10,0 0 28px #53c9ff}.sub{font-size:clamp(16px,4vw,25px);margin:12px 0 28px}button{border:0;border-radius:17px;padding:16px 31px;font-size:22px;font-weight:900;background:#ffd32b;color:#10131a;box-shadow:0 7px #9a7200}button:active{transform:translateY(4px)}#message{position:absolute;z-index:40;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(30px,9vw,68px);font-weight:1000;text-align:center;text-shadow:0 4px 5px #000;pointer-events:none}.pop{position:absolute;z-index:35;font-size:28px;font-weight:1000;pointer-events:none;animation:fly .7s forwards;text-shadow:0 3px #000}@keyframes fly{to{opacity:0;transform:translateY(-100px) scale(1.3)}}.flash{position:absolute;z-index:34;pointer-events:none;font-size:50px;animation:bang .3s forwards}@keyframes bang{to{opacity:0;transform:scale(2)}}#resultScore{font-size:clamp(55px,15vw,105px);font-weight:1000;color:#ffd32b}.note{opacity:.75;font-size:14px;margin-top:24px}
#city{will-change:transform}
.building{will-change:transform}
.splatter{position:fixed;z-index:38;pointer-events:none;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #bde8ff;box-shadow:0 0 8px #fff;animation:splat .65s ease-out forwards}
@keyframes splat{0%{opacity:1;transform:translate(0,0) scale(.4)}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.5)}}
.defeat{position:fixed;z-index:37;pointer-events:none;font-size:64px;animation:defeat .45s ease-out forwards;filter:drop-shadow(0 4px 3px #000)}
@keyframes defeat{0%{opacity:1;transform:translate(-50%,-50%) scale(.5) rotate(-10deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.8) rotate(18deg)}}
.muzzle{position:fixed;z-index:39;pointer-events:none;font-size:44px;animation:muzzle .18s forwards}
@keyframes muzzle{to{opacity:0;transform:scale(1.8)}}

.sideEnemy{position:absolute;z-index:1;font-size:clamp(58px,12vw,105px);filter:drop-shadow(0 4px 3px #0008);animation:peek .22s ease-out;user-select:none}
@keyframes peek{from{transform:translateX(55%) scale(.7);opacity:.3}to{transform:translateX(0) scale(1);opacity:1}}

.cloudLayer,.farLayer,.frontLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:8}
.cloud{position:absolute;font-size:clamp(50px,10vw,100px);opacity:.85;filter:drop-shadow(0 4px 3px #0001)}
.farBuilding{position:absolute;bottom:20%;border-radius:14px 14px 0 0;opacity:.48;background:linear-gradient(#b9a8ff,#7bc8e8);box-shadow:inset -7px 0 #0001}
.farBuilding:after{content:"";position:absolute;inset:14% 18%;background:repeating-linear-gradient(90deg,#eaffff 0 12%,transparent 12% 27%),repeating-linear-gradient(0deg,#eaffff 0 10%,transparent 10% 25%);opacity:.65}
.frontObj{position:absolute;bottom:16%;font-size:clamp(55px,10vw,100px);filter:drop-shadow(0 6px 4px #0004)}
</style></head><body>
<div id="game"><div id="city"></div><div id="hud" class="hidden"><div>STAGE 1 CITY</div><div id="score">SCORE 0</div><div id="combo"></div><div id="timer">30.0</div></div><div id="message"></div>
<div id="title" class="screen"><h1>BREAK SHOT</h1><div class="sub">STAGE 1 カラフルタウン 🌈</div><button id="start">GAME START</button><div class="note">カラフルな街を右へ進みながらモンスターをポコッ！<br>⭐は撃たないでね。ボスは3発必要。</div></div>
<div id="result" class="screen hidden"><h1>TIME!</h1><div id="resultScore">0</div><div id="rank" class="sub"></div><button id="retry">もう一度</button></div></div>
<script>
const $=q=>document.querySelector(q),city=$("#city"),scoreEl=$("#score"),timerEl=$("#timer"),comboEl=$("#combo"),msg=$("#message");let score=0,running=false,endAt=0,loop,raf,combo=0,lastHit=0,windows=[],scrollX=0,lastFrame=0;
function snd(f=180,d=.05,t="square"){try{const A=window._a||(window._a=new(AudioContext||webkitAudioContext)()),o=A.createOscillator(),g=A.createGain();o.type=t;o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(A.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.stop(A.currentTime+d)}catch(e){}}
function build(){city.innerHTML='<div class="sky"></div><div class="sun"></div><div class="cloudLayer" id="cloudLayer"></div><div class="farLayer" id="farLayer"></div><div class="road"></div><div class="frontLayer" id="frontLayer"></div>';windows=[];
const cl=document.getElementById("cloudLayer");
for(let i=0;i<6;i++){let c=document.createElement("div");c.className="cloud";c.textContent="☁️";c.dataset.base=(i*28+5);c.style.left=c.dataset.base+"%";c.style.top=(5+(i%3)*10)+"%";cl.appendChild(c)}
const fl=document.getElementById("farLayer");
for(let i=0;i<8;i++){let f=document.createElement("div");f.className="farBuilding";f.dataset.base=(i*18-8);f.style.left=f.dataset.base+"%";f.style.width=(13+(i%3)*4)+"%";f.style.height=(30+(i%4)*9)+"%";fl.appendChild(f)}
const fr=document.getElementById("frontLayer");
for(let i=0;i<6;i++){let o=document.createElement("div");o.className="frontObj";o.dataset.base=(i*30+8);o.style.left=o.dataset.base+"%";o.textContent=i%2?"🌳":"🚦";fr.appendChild(o)}[[0,28,62],[20,26,52],[43,30,67],[68,28,56],[86,22,70]].forEach((s,i)=>{let b=document.createElement("div");b.className="building "+(i%2?"alt":"");b.style.left=s[0]+"%";b.style.width=s[1]+"%";b.style.height=(s[2]+[-6,8,-2,10,-8][i])+"%";
if(i===0)b.style.clipPath="polygon(0 8%,18% 8%,18% 0,82% 0,82% 8%,100% 8%,100% 100%,0 100%)";
if(i===1)b.style.borderRadius="24px 24px 0 0";
if(i===2)b.style.clipPath="polygon(0 12%,30% 12%,30% 0,70% 0,70% 12%,100% 12%,100% 100%,0 100%)";
if(i===3)b.style.borderRadius="45% 45% 0 0 / 10% 10% 0 0";
if(i===4)b.style.clipPath="polygon(0 6%,65% 6%,65% 0,100% 0,100% 100%,0 100%)";
city.appendChild(b);for(let r=0;r<2;r++)for(let c=0;c<2;c++){let w=document.createElement("div");w.className="window";w.style.width="39%";w.style.aspectRatio="1 / 1";w.style.height="auto";w.style.left=(6+c*49)+"%";w.style.top=(10+r*45)+"%";b.appendChild(w);windows.push(w)}})}
function spawnSide(){
 if(!running)return;
 const bs=[...document.querySelectorAll(".building")];
 if(!bs.length)return;
 const b=bs[Math.floor(Math.random()*bs.length)];
 const e=document.createElement("div");e.className="sideEnemy";
 const guys=["🍄","🐢","🦀"];e.textContent=guys[Math.floor(Math.random()*guys.length)];
 e.style.left=(b.offsetLeft+b.offsetWidth-25)+"px";
 e.style.top=(b.offsetTop+b.offsetHeight*(.3+Math.random()*.45))+"px";
 e.dataset.type="bad";e.dataset.hp=1;
 e.onpointerdown=hit;city.appendChild(e);
 setTimeout(()=>e.isConnected&&e.remove(),1350);
}
function spawn(){if(!running)return;let free=windows.filter(w=>!w.querySelector(".actor"));if(!free.length)return;let w=free[Math.floor(Math.random()*free.length)],r=Math.random(),type=r<.05?"boss":r<.15?"cop":"bad",a=document.createElement("div");
let badGuys=["🍄","🐢","🦀"], bosses=["🐲","👾"];
let icon=type==="cop"?"⭐":type==="boss"?bosses[Math.floor(Math.random()*bosses.length)]:badGuys[Math.floor(Math.random()*badGuys.length)];
a.className="actor "+type;a.dataset.type=type;a.dataset.hp=type==="boss"?3:1;a.innerHTML=`<span class="person">${icon}</span>${type==="boss"?'<span class="hp"><i></i></span>':""}`;a.onpointerdown=hit;w.appendChild(a);setTimeout(()=>a.isConnected&&a.remove(),type==="boss"?2800:1600)}
function fx(e,t){let b=document.createElement("div");b.className="flash";b.style.left=e.clientX-25+"px";b.style.top=e.clientY-30+"px";b.textContent="💥";document.body.appendChild(b);let p=document.createElement("div");p.className="pop";p.style.left=e.clientX+"px";p.style.top=e.clientY+"px";p.textContent=t;document.body.appendChild(p);setTimeout(()=>{b.remove();p.remove()},750)}
function hit(e){if(!running)return;e.stopPropagation();muzzle(e);let type=this.dataset.type;if(type==="cop"){score=Math.max(0,score-1000);combo=0;scoreEl.textContent="SCORE "+score.toLocaleString();comboEl.textContent="警官！ -1000";fx(e,"-1000");snd(70,.15,"sawtooth");this.remove();return}let hp=+this.dataset.hp-1;this.dataset.hp=hp;if(type==="boss"&&hp>0){this.querySelector(".hp i").style.width=(hp/3*100)+"%";comboEl.textContent="BOSS あと"+hp+"発！";fx(e,"HIT!");snd(110,.05);return}let now=performance.now();combo=now-lastHit<900?combo+1:1;lastHit=now;let base=type==="boss"?1500:100,m=Math.min(5,1+Math.floor((combo-1)/5)),pts=base*m;score+=pts;scoreEl.textContent="SCORE "+score.toLocaleString();comboEl.textContent=combo>1?combo+" COMBO ×"+m:"";fx(e,"+"+pts);smokeBurst(e,type==="boss");poko(type==="boss");this.remove()}

function poko(big=false){try{const A=window._a||(window._a=new(AudioContext||webkitAudioContext)()),o=A.createOscillator(),g=A.createGain();o.type="sine";o.frequency.setValueAtTime(big?240:330,A.currentTime);o.frequency.exponentialRampToValueAtTime(big?90:150,A.currentTime+.11);g.gain.setValueAtTime(.11,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+.13);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+.14)}catch(e){}}
function shotSound(){
 try{
  const A=window._a||(window._a=new(AudioContext||webkitAudioContext)());
  const o=A.createOscillator(),g=A.createGain();
  o.type="square";o.frequency.setValueAtTime(170,A.currentTime);o.frequency.exponentialRampToValueAtTime(70,A.currentTime+.055);
  g.gain.setValueAtTime(.075,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+.075);
  o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+.08);
 }catch(e){}
}
function smokeBurst(e,strong=false){
 const count=strong?22:12;
 for(let i=0;i<count;i++){
  let d=document.createElement("i");d.className="splatter";
  d.style.left=(e.clientX-8)+"px";d.style.top=(e.clientY-8)+"px";
  let a=Math.random()*Math.PI*2,dist=(strong?55:35)+Math.random()*(strong?100:70);
  d.style.setProperty("--dx",Math.cos(a)*dist+"px");d.style.setProperty("--dy",Math.sin(a)*dist+"px");
  d.style.width=d.style.height=(5+Math.random()*12)+"px";
  document.body.appendChild(d);setTimeout(()=>d.remove(),700);
 }
 let k=document.createElement("div");k.className="defeat";k.style.left=e.clientX+"px";k.style.top=e.clientY+"px";k.textContent=strong?"☁️✨":"☁️";
 document.body.appendChild(k);setTimeout(()=>k.remove(),500);
}
function muzzle(e){
 let m=document.createElement("div");m.className="muzzle";m.style.left=(e.clientX-20)+"px";m.style.top=(e.clientY-22)+"px";m.textContent="✦";
 document.body.appendChild(m);setTimeout(()=>m.remove(),220);shotSound();
}
function start(){ $("#title").classList.add("hidden");$("#result").classList.add("hidden");$("#hud").classList.remove("hidden");score=combo=0;scrollX=0;lastFrame=performance.now();scoreEl.textContent="SCORE 0";comboEl.textContent="";build();msg.textContent="STAGE 1";setTimeout(()=>{msg.textContent="";running=true;endAt=performance.now()+30000;loop=setInterval(()=>{spawn();if(Math.random()<.28)spawnSide()},390);for(let i=0;i<4;i++)spawn();spawnSide();tick()},850)}
function tick(now=performance.now()){
 if(!running)return;
 let dt=Math.min(40,now-lastFrame);lastFrame=now;
 scrollX+=dt*.018;

 // 奥の雲：最もゆっくり
 document.querySelectorAll(".cloud").forEach(el=>{
   let base=+el.dataset.base,x=base-scrollX*.12;
   while(x<-18){base+=180;el.dataset.base=base;x=base-scrollX*.12}
   el.style.left=x+"%";
 });
 // 遠景ビル：ゆっくり
 document.querySelectorAll(".farBuilding").forEach(el=>{
   let base=+el.dataset.base,x=base-scrollX*.32;
   while(x<-25){base+=165;el.dataset.base=base;x=base-scrollX*.32}
   el.style.left=x+"%";
 });
 // メインのビル：通常速度
 document.querySelectorAll(".building").forEach((b,i)=>{
   let base=parseFloat(b.dataset.base||b.style.left);if(!b.dataset.base)b.dataset.base=base;
   let x=base-scrollX;
   if(x<-32){x+=125;b.dataset.base=(x+scrollX).toString()}
   b.style.left=x+"%";
 });
 // 手前の木・信号：速い
 document.querySelectorAll(".frontObj").forEach(el=>{
   let base=+el.dataset.base,x=base-scrollX*1.65;
   while(x<-18){base+=190;el.dataset.base=base;x=base-scrollX*1.65}
   el.style.left=x+"%";
 });
 let l=Math.max(0,endAt-performance.now());timerEl.textContent=(l/1000).toFixed(1);
 if(l<=0)return finish();raf=requestAnimationFrame(tick)
}
function finish(){running=false;clearInterval(loop);cancelAnimationFrame(raf);msg.textContent="TIME!";snd(600,.25);setTimeout(()=>{msg.textContent="";$("#hud").classList.add("hidden");$("#result").classList.remove("hidden");$("#resultScore").textContent=score.toLocaleString();$("#rank").textContent="RANK "+(score>=15000?"S":score>=10000?"A":score>=6000?"B":"C")},900)}

let lastTouchEnd=0;
document.addEventListener("touchend",function(e){
  const now=Date.now();
  if(now-lastTouchEnd<=350)e.preventDefault();
  lastTouchEnd=now;
},{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("gestureend",e=>e.preventDefault(),{passive:false});

document.getElementById("game").addEventListener("pointerdown",e=>{
 if(!running)return;
 if(e.target.closest(".actor")||e.target.closest("button"))return;
 muzzle(e);
});

let lastTap=0;
function blockZoom(e){e.preventDefault()}
document.addEventListener("dblclick",blockZoom,{passive:false});
document.addEventListener("gesturestart",blockZoom,{passive:false});
document.addEventListener("gesturechange",blockZoom,{passive:false});
document.addEventListener("gestureend",blockZoom,{passive:false});
document.addEventListener("touchstart",function(e){
 if(e.touches && e.touches.length>1)e.preventDefault();
},{passive:false});
document.addEventListener("touchend",function(e){
 const now=Date.now();
 if(now-lastTap<400)e.preventDefault();
 lastTap=now;
},{passive:false});
document.addEventListener("touchmove",function(e){
 if(e.touches && e.touches.length>1)e.preventDefault();
},{passive:false});

$("#start").onclick=start;$("#retry").onclick=start;build();
</script></body></html>
