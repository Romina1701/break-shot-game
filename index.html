<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BREAK SHOT</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101b;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#game{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#69b9e9 0 50%,#303841 50%)}#city{position:absolute;inset:0}.sky{position:absolute;inset:0 0 20%;background:linear-gradient(#55a9df,#dff5ff)}.sun{position:absolute;width:85px;height:85px;border-radius:50%;background:#fff3a0;right:8%;top:9%;box-shadow:0 0 40px #fff4aa}.road{position:absolute;bottom:0;width:100%;height:20%;background:#333940;border-top:7px solid #bbb}.road:after{content:"";position:absolute;top:50%;width:100%;border-top:6px dashed #f6d55c}.building{position:absolute;bottom:18%;background:linear-gradient(90deg,#384c5a,#617989);border:3px solid #25343e;box-shadow:8px 0 14px #0005}.building.alt{background:linear-gradient(90deg,#65534c,#8b7063)}.window{position:absolute;background:#10283b;border:3px solid #a7c0cb;overflow:hidden;box-shadow:inset 0 0 12px #000}.window:after{content:"";position:absolute;left:50%;height:100%;border-left:2px solid #8ca4af}.actor{position:absolute;inset:0;z-index:3;display:flex;align-items:flex-end;justify-content:center;animation:rise .18s ease-out}.person{font-size:clamp(42px,8vw,70px);line-height:.95;filter:drop-shadow(0 4px 2px #0009)}.cop .person{filter:drop-shadow(0 0 8px #42aaff)}.boss .person{font-size:clamp(54px,10vw,88px);filter:drop-shadow(0 0 10px #f33)}.hp{position:absolute;top:3px;left:8%;right:8%;height:7px;background:#450909;border:1px solid #fff}.hp i{display:block;height:100%;width:100%;background:#ff3535}@keyframes rise{from{transform:translateY(75%)}to{transform:translateY(0)}}#hud{position:absolute;z-index:20;top:0;width:100%;display:flex;justify-content:space-between;padding:10px;background:linear-gradient(#06101ee8,transparent);font-weight:900;font-size:clamp(14px,4vw,23px);text-shadow:0 2px #000;pointer-events:none}#timer{color:#ffd52c}#combo{color:#7effa1}.hidden{display:none!important}.screen{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 35%,#214e75,#07111d 72%)}h1{font-size:clamp(43px,11vw,90px);margin:0;text-shadow:0 5px #080b10,0 0 28px #53c9ff}.sub{font-size:clamp(16px,4vw,25px);margin:12px 0 28px}button{border:0;border-radius:17px;padding:16px 31px;font-size:22px;font-weight:900;background:#ffd32b;color:#10131a;box-shadow:0 7px #9a7200}button:active{transform:translateY(4px)}#message{position:absolute;z-index:40;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(30px,9vw,68px);font-weight:1000;text-align:center;text-shadow:0 4px 5px #000;pointer-events:none}.pop{position:absolute;z-index:35;font-size:28px;font-weight:1000;pointer-events:none;animation:fly .7s forwards;text-shadow:0 3px #000}@keyframes fly{to{opacity:0;transform:translateY(-100px) scale(1.3)}}.flash{position:absolute;z-index:34;pointer-events:none;font-size:50px;animation:bang .3s forwards}@keyframes bang{to{opacity:0;transform:scale(2)}}#resultScore{font-size:clamp(55px,15vw,105px);font-weight:1000;color:#ffd32b}.note{opacity:.75;font-size:14px;margin-top:24px}</style></head><body>
<div id="game"><div id="city"></div><div id="hud" class="hidden"><div>STAGE 1 CITY</div><div id="score">SCORE 0</div><div id="combo"></div><div id="timer">30.0</div></div><div id="message"></div>
<div id="title" class="screen"><h1>BREAK SHOT</h1><div class="sub">STAGE 1 ビル街 💥</div><button id="start">GAME START</button><div class="note">窓から現れる悪者を撃て！<br>👮 警官は撃たない。👹 ボスは3発必要。</div></div>
<div id="result" class="screen hidden"><h1>TIME!</h1><div id="resultScore">0</div><div id="rank" class="sub"></div><button id="retry">もう一度</button></div></div>
<script>
const $=q=>document.querySelector(q),city=$("#city"),scoreEl=$("#score"),timerEl=$("#timer"),comboEl=$("#combo"),msg=$("#message");let score=0,running=false,endAt=0,loop,raf,combo=0,lastHit=0,windows=[];
function snd(f=180,d=.05,t="square"){try{const A=window._a||(window._a=new(AudioContext||webkitAudioContext)()),o=A.createOscillator(),g=A.createGain();o.type=t;o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(A.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.stop(A.currentTime+d)}catch(e){}}
function build(){city.innerHTML='<div class="sky"></div><div class="sun"></div><div class="road"></div>';windows=[];[[0,28,62],[20,26,52],[43,30,67],[68,28,56],[86,22,70]].forEach((s,i)=>{let b=document.createElement("div");b.className="building "+(i%2?"alt":"");b.style.left=s[0]+"%";b.style.width=s[1]+"%";b.style.height=s[2]+"%";city.appendChild(b);for(let r=0;r<3;r++)for(let c=0;c<2;c++){let w=document.createElement("div");w.className="window";w.style.width="31%";w.style.height="20%";w.style.left=(13+c*45)+"%";w.style.top=(12+r*28)+"%";b.appendChild(w);windows.push(w)}})}
function spawn(){if(!running)return;let free=windows.filter(w=>!w.querySelector(".actor"));if(!free.length)return;let w=free[Math.floor(Math.random()*free.length)],r=Math.random(),type=r<.05?"boss":r<.15?"cop":"bad",a=document.createElement("div");a.className="actor "+type;a.dataset.type=type;a.dataset.hp=type==="boss"?3:1;a.innerHTML=`<span class="person">${type==="cop"?"👮":type==="boss"?"👹":"🥷"}</span>${type==="boss"?'<span class="hp"><i></i></span>':""}`;a.onpointerdown=hit;w.appendChild(a);setTimeout(()=>a.isConnected&&a.remove(),type==="boss"?2800:1600)}
function fx(e,t){let b=document.createElement("div");b.className="flash";b.style.left=e.clientX-25+"px";b.style.top=e.clientY-30+"px";b.textContent="💥";document.body.appendChild(b);let p=document.createElement("div");p.className="pop";p.style.left=e.clientX+"px";p.style.top=e.clientY+"px";p.textContent=t;document.body.appendChild(p);setTimeout(()=>{b.remove();p.remove()},750)}
function hit(e){if(!running)return;e.stopPropagation();let type=this.dataset.type;if(type==="cop"){score=Math.max(0,score-1000);combo=0;scoreEl.textContent="SCORE "+score.toLocaleString();comboEl.textContent="警官！ -1000";fx(e,"-1000");snd(70,.15,"sawtooth");this.remove();return}let hp=+this.dataset.hp-1;this.dataset.hp=hp;if(type==="boss"&&hp>0){this.querySelector(".hp i").style.width=(hp/3*100)+"%";comboEl.textContent="BOSS あと"+hp+"発！";fx(e,"HIT!");snd(110,.05);return}let now=performance.now();combo=now-lastHit<900?combo+1:1;lastHit=now;let base=type==="boss"?1500:100,m=Math.min(5,1+Math.floor((combo-1)/5)),pts=base*m;score+=pts;scoreEl.textContent="SCORE "+score.toLocaleString();comboEl.textContent=combo>1?combo+" COMBO ×"+m:"";fx(e,"+"+pts);snd(type==="boss"?650:260+combo*20,.07);this.remove()}
function start(){ $("#title").classList.add("hidden");$("#result").classList.add("hidden");$("#hud").classList.remove("hidden");score=combo=0;scoreEl.textContent="SCORE 0";comboEl.textContent="";build();msg.textContent="STAGE 1";setTimeout(()=>{msg.textContent="";running=true;endAt=performance.now()+30000;loop=setInterval(spawn,390);for(let i=0;i<4;i++)spawn();tick()},850)}
function tick(){if(!running)return;let l=Math.max(0,endAt-performance.now());timerEl.textContent=(l/1000).toFixed(1);if(l<=0)return finish();raf=requestAnimationFrame(tick)}
function finish(){running=false;clearInterval(loop);cancelAnimationFrame(raf);msg.textContent="TIME!";snd(600,.25);setTimeout(()=>{msg.textContent="";$("#hud").classList.add("hidden");$("#result").classList.remove("hidden");$("#resultScore").textContent=score.toLocaleString();$("#rank").textContent="RANK "+(score>=15000?"S":score>=10000?"A":score>=6000?"B":"C")},900)}
$("#start").onclick=start;$("#retry").onclick=start;build();
</script></body></html>
