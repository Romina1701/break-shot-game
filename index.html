<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Castle Pop Rush</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,sans-serif;background:#148dff;color:white}#g{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#168eff 0 58%,#5bd25a 58% 83%,#cfa467 83%)}#scene,#targets{position:absolute;inset:0;overflow:hidden}.cloud{position:absolute;font-size:70px;opacity:.55}.hill{position:absolute;bottom:17%;width:52%;height:30%;border-radius:55% 55% 0 0;background:#36bb55}.castle{position:absolute;bottom:17%;width:53%;height:60%;border:5px solid #914137;background:repeating-linear-gradient(0deg,#ee805f 0 25px,#b84d42 26px 30px);box-shadow:8px 8px #0002}.castle:before{content:"";position:absolute;left:-5px;right:-5px;top:-32px;height:35px;background:#ed805e;clip-path:polygon(0 100%,0 35%,10% 35%,10% 0,22% 0,22% 35%,38% 35%,38% 0,52% 0,52% 35%,68% 35%,68% 0,82% 0,82% 35%,100% 35%,100% 100%)}.purple{filter:hue-rotate(280deg)}.green{filter:hue-rotate(65deg)}.win{position:absolute;width:42%;height:34%;border:11px solid #ffc86e;border-radius:46% 46% 5px 5px;background:#153858;box-shadow:0 5px #843a32,inset 0 0 18px #000}.w1{left:5%;top:10%}.w2{right:5%;top:10%}.w3{left:5%;top:53%}.w4{right:5%;top:53%}.plant{position:absolute;bottom:13%;font-size:70px}.enemy{position:absolute;z-index:12;width:clamp(92px,18vw,155px);height:clamp(86px,17vw,145px);filter:drop-shadow(0 7px 4px #0005);animation:in .14s ease-out}@keyframes in{from{transform:scale(.3);opacity:.2}to{transform:scale(1);opacity:1}}.cap{position:absolute;left:5%;top:2%;width:90%;height:49%;border-radius:55% 55% 35% 35%;background:radial-gradient(circle at 28% 28%,#ffe858 0 12%,transparent 13%),radial-gradient(circle at 72% 34%,#ffe858 0 11%,transparent 12%),linear-gradient(#ff6558,#d93649);border:5px solid #6e2940}.face{position:absolute;left:21%;top:39%;width:58%;height:45%;border-radius:44%;background:#ffd19a;border:5px solid #6f3e31}.eye{position:absolute;background:#17233a;border-radius:50%}.face .eye{top:22%;width:12%;height:29%}.e1{left:25%}.e2{right:25%}.foot{position:absolute;bottom:1%;width:35%;height:18%;border-radius:50%;background:#704035}.f1{left:10%}.f2{right:10%}.shell{position:absolute;left:8%;top:18%;width:65%;height:60%;border-radius:50%;background:radial-gradient(circle,#ffe76a 0 13%,#61d25f 14% 39%,#258b55 40%);border:5px solid #1f6445}.head{position:absolute;right:0;top:7%;width:46%;height:43%;border-radius:50%;background:#f7db65;border:5px solid #6e6530}.head .eye{right:21%;top:25%;width:12%;height:22%}.leg{position:absolute;bottom:2%;width:25%;height:25%;border-radius:45%;background:#f7db65;border:4px solid #6e6530}.l1{left:15%}.l2{right:13%}.boss{transform:scale(1.35);filter:drop-shadow(0 0 16px #ffe64b)}#hud{position:absolute;z-index:30;top:0;left:0;right:0;padding:10px 12px;display:flex;justify-content:space-between;font-weight:1000;font-size:clamp(14px,4vw,23px);text-shadow:0 3px #000;background:linear-gradient(#001a48d9,transparent)}#time{color:#ffe43b}#combo{color:#baff96}#msg{position:absolute;z-index:45;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(38px,11vw,80px);font-weight:1000;text-align:center;text-shadow:0 5px #571d75,0 0 14px white;pointer-events:none}.splash{position:fixed;z-index:50;width:28px;height:28px;border-radius:50%;background:var(--c);pointer-events:none;animation:s .48s forwards}@keyframes s{to{opacity:0;transform:translate(var(--x),var(--y)) scale(1.8)}}.plus{position:fixed;z-index:51;font-size:clamp(38px,10vw,72px);font-weight:1000;text-shadow:0 5px #842b99,0 0 10px white;pointer-events:none;animation:p .62s forwards}@keyframes p{to{opacity:0;transform:translateY(-95px) scale(1.3)}}.screen{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px;background:radial-gradient(circle at 50% 35%,#2d73d0,#111c43 72%)}.hidden{display:none!important}h1{margin:0;font-size:clamp(45px,12vw,90px);text-shadow:0 6px #071229,0 0 25px #54e6ff}.sub{margin:12px 0 28px;font-size:clamp(18px,5vw,27px)}button{border:0;border-radius:18px;padding:17px 32px;font-size:22px;font-weight:1000;background:#ffe03b;color:#172039;box-shadow:0 7px #9d7600}.small{font-size:14px;opacity:.82;margin-top:20px}
</style></head><body><div id="g"><div id="scene"></div><div id="targets"></div><div id="hud" class="hidden"><span id="zone">CASTLE</span><span id="score">SCORE 0</span><span id="combo"></span><span id="time">30.0</span></div><div id="msg"></div><div id="title" class="screen"><h1>CASTLE POP</h1><div class="sub">RUSH! 🎯</div><button id="start">GAME START</button><div class="small">CASTLE → GREEN FIELD → FINAL RUSH<br>大きな敵をテンポよく撃ちまくれ！</div></div><div id="result" class="screen hidden"><h1>FINISH!</h1><div id="final" class="sub"></div><button id="retry">もう一度</button></div></div><script>
const $=s=>document.querySelector(s),sc=$("#scene"),tg=$("#targets"),msg=$("#msg");let run=false,score=0,combo=0,last=0,end=0,tm,bgm,phase=-1,step=0;
function AC(){return window._ac||(window._ac=new(AudioContext||webkitAudioContext)())}function beep(f=300,d=.06,v=.03,type="square"){try{let a=AC(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
let notes=[523,659,784,659,587,698,880,698,659,784,988,784];function music(){clearInterval(bgm);step=0;bgm=setInterval(()=>{if(run){beep(notes[step++%notes.length],.12,.012,"triangle");if(step%4===0)beep(131,.08,.006)}},180)}
function art(k){return k==="m"?'<i class="cap"></i><i class="face"><i class="eye e1"></i><i class="eye e2"></i></i><i class="foot f1"></i><i class="foot f2"></i>':'<i class="shell"></i><i class="head"><i class="eye"></i></i><i class="leg l1"></i><i class="leg l2"></i>'}
function castle(){sc.innerHTML='<div class="cloud" style="left:8%;top:9%">☁️</div><div class="cloud" style="left:68%;top:17%">☁️</div>';[0,58,116].forEach((x,i)=>sc.insertAdjacentHTML("beforeend",`<div class="castle ${i==1?"purple":i==2?"green":""}" style="left:${x}%"><i class="win w1"></i><i class="win w2"></i><i class="win w3"></i><i class="win w4"></i></div>`));sc.insertAdjacentHTML("beforeend",'<div class="plant" style="left:5%">🌼</div><div class="plant" style="left:46%">🌳</div><div class="plant" style="left:84%">🌸</div>')}
function field(){sc.innerHTML='<div class="cloud" style="left:8%;top:10%">☁️</div><div class="cloud" style="left:66%;top:18%">☁️</div>';for(let i=0;i<5;i++)sc.insertAdjacentHTML("beforeend",`<div class="hill" style="left:${i*36-20}%"></div>`);sc.insertAdjacentHTML("beforeend",'<div class="plant" style="left:8%">🌳</div><div class="plant" style="left:68%">🌲</div><div class="plant" style="left:40%">🌼</div>')}
function setPhase(p){phase=p;tg.innerHTML="";if(p===0){castle();$("#zone").textContent="CASTLE";msg.textContent="CASTLE!"}else if(p===1){field();$("#zone").textContent="GREEN FIELD";msg.textContent="GO! GO!"}else{castle();$("#zone").textContent="FINAL RUSH";msg.textContent="FINAL RUSH!";beep(110,.3,.07,"sawtooth")}setTimeout(()=>msg.textContent="",550)}
function spawn(){if(!run)return;let n=phase===2?(Math.random()<.5?2:3):1;for(let j=0;j<n;j++){let e=document.createElement("div");e.className="enemy";e.innerHTML=art(Math.random()<.5?"m":"t");e.dataset.hp=phase===2&&Math.random()<.13?3:1;if(+e.dataset.hp>1)e.classList.add("boss");e.style.left=(3+Math.random()*82)+"%";e.style.top=(18+Math.random()*58)+"%";e.onpointerdown=hit;tg.appendChild(e);setTimeout(()=>e.isConnected&&e.remove(),phase===2?1000:1350)}}
function hit(ev){if(!run)return;ev.stopPropagation();beep(210,.04,.025);let e=ev.currentTarget,h=+e.dataset.hp-1;e.dataset.hp=h;if(h>0){plus(ev,"HIT!");return}let now=performance.now();combo=now-last<850?combo+1:1;last=now;let pt=(combo>=10?2:1)*(e.classList.contains("boss")?2:1);score+=pt;$("#score").textContent="SCORE "+score;$("#combo").textContent=combo>2?combo+" COMBO":"";splash(ev);plus(ev,"+"+pt);beep(420+Math.min(combo,12)*20,.08,.05,"sine");e.animate([{transform:"scale(1)"},{transform:"translateY(-55px) rotate(18deg) scale(.2)",opacity:0}],{duration:250,fill:"forwards"});setTimeout(()=>e.remove(),245)}
function splash(ev){let cs=["#8d43ff","#ff4778","#38d9ff","#ffe83e","#55e36c"];for(let i=0;i<15;i++){let s=document.createElement("i");s.className="splash";s.style.left=ev.clientX+"px";s.style.top=ev.clientY+"px";s.style.setProperty("--c",cs[i%5]);let a=Math.random()*6.28,d=35+Math.random()*95;s.style.setProperty("--x",Math.cos(a)*d+"px");s.style.setProperty("--y",Math.sin(a)*d+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),510)}}
function plus(ev,t){let p=document.createElement("b");p.className="plus";p.textContent=t;p.style.left=(ev.clientX-20)+"px";p.style.top=(ev.clientY-35)+"px";document.body.appendChild(p);setTimeout(()=>p.remove(),650)}
function start(){score=combo=0;phase=-1;$("#score").textContent="SCORE 0";$("#combo").textContent="";$("#title").classList.add("hidden");$("#result").classList.add("hidden");$("#hud").classList.remove("hidden");run=true;end=performance.now()+30000;setPhase(0);music();clearInterval(tm);tm=setInterval(loop,330)}
function loop(){if(!run)return;let left=end-performance.now(),elapsed=30000-left;$("#time").textContent=(Math.max(0,left)/1000).toFixed(1);if(elapsed>20000&&phase<2)setPhase(2);else if(elapsed>10000&&phase<1)setPhase(1);spawn();if(left<=0)finish()}
function finish(){run=false;clearInterval(tm);clearInterval(bgm);tg.innerHTML="";$("#hud").classList.add("hidden");msg.textContent="FINISH!";beep(784,.2,.06,"triangle");setTimeout(()=>{msg.textContent="";$("#result").classList.remove("hidden");$("#final").innerHTML=`SCORE <b style="font-size:2em;color:#ffe03b">${score}</b><br>RANK ${score>=80?"S":score>=55?"A":score>=35?"B":"C"}`},650)}
$("#start").onclick=$("#retry").onclick=start;let lt=0;["dblclick","gesturestart","gesturechange","gestureend"].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));document.addEventListener("touchend",e=>{let n=Date.now();if(n-lt<400)e.preventDefault();lt=n},{passive:false});castle();
</script></body></html>
