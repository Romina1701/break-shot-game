<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BREAK SHOT - CASTLE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52bdf4;color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#game{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:linear-gradient(#42baff 0 63%,#6bd665 63%);cursor:crosshair}
.layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#sky{background:linear-gradient(#38b5ff,#dff8ff 72%)}
.sun{position:absolute;right:8%;top:9%;width:80px;height:80px;border-radius:50%;background:#fff29a;box-shadow:0 0 42px #fff5a7}
.cloud{position:absolute;font-size:clamp(54px,11vw,105px);opacity:.82;filter:drop-shadow(0 4px 2px #0001)}
.hill{position:absolute;bottom:18%;width:38%;height:25%;border-radius:55% 55% 0 0;background:#4ebf66;opacity:.7}
.farCastle{position:absolute;bottom:20%;width:18%;height:34%;background:#a990ff;border-radius:14px 14px 0 0;opacity:.48}
.farCastle:before{content:"";position:absolute;left:15%;right:15%;top:-14px;height:20px;background:linear-gradient(90deg,#a990ff 0 20%,transparent 20% 40%,#a990ff 40% 60%,transparent 60% 80%,#a990ff 80%)}
.ground{position:absolute;left:0;right:0;bottom:0;height:19%;background:linear-gradient(#68d75e,#48b74e);border-top:7px solid #a5ec77}
.path{position:absolute;left:0;right:0;bottom:0;height:11%;background:#e6b96d;border-top:5px solid #fff0a8}
.castle{position:absolute;bottom:17%;width:34%;height:57%;z-index:5;background:linear-gradient(90deg,#ff936c,#ffd16a);border:4px solid #d96552;box-shadow:8px 8px 0 #0002;pointer-events:none}
.castle.purple{background:linear-gradient(90deg,#9b86ff,#67d6e8);border-color:#6655ca}
.castle.green{background:linear-gradient(90deg,#67d77b,#f3d86c);border-color:#3eaa63}
.castle .tower{position:absolute;bottom:0;width:27%;height:118%;background:inherit;border:inherit}
.castle .tower.l{left:-14%}.castle .tower.r{right:-14%}
.castle .tower:before{content:"";position:absolute;left:-5px;right:-5px;top:-24px;height:28px;background:inherit;clip-path:polygon(0 100%,0 35%,18% 35%,18% 0,38% 0,38% 35%,62% 35%,62% 0,82% 0,82% 35%,100% 35%,100% 100%)}
.castle .battlement{position:absolute;left:-4px;right:-4px;top:-25px;height:29px;background:inherit;clip-path:polygon(0 100%,0 35%,12% 35%,12% 0,27% 0,27% 35%,43% 35%,43% 0,58% 0,58% 35%,74% 35%,74% 0,89% 0,89% 35%,100% 35%,100% 100%)}
.window{position:absolute;width:29%;aspect-ratio:1/1;background:linear-gradient(#d8f7ff,#75c8f3);border:4px solid #fff5cf;box-shadow:inset 0 0 12px #2677a4;overflow:hidden;pointer-events:auto;border-radius:4px}
.window:after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #fff8;pointer-events:none}
.door{position:absolute;left:37%;bottom:0;width:27%;height:28%;border-radius:50% 50% 0 0;background:#50385f;border:5px solid #fff0bd;overflow:hidden;pointer-events:auto}
.actor{position:absolute;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;animation:rise .18s ease-out;pointer-events:auto;user-select:none}
.person{font-size:clamp(55px,11vw,100px);line-height:.9;filter:drop-shadow(0 5px 3px #0005)}
.boss .person{font-size:clamp(68px,14vw,125px);filter:drop-shadow(0 0 10px #ffed5b)}
.hp{position:absolute;left:7%;right:7%;top:3px;height:8px;background:#401010;border:2px solid #fff;border-radius:6px;overflow:hidden}.hp i{display:block;height:100%;width:100%;background:#ff4d4d}
@keyframes rise{from{transform:translateY(75%) scale(.7)}to{transform:translateY(0) scale(1)}}
.sideEnemy{position:absolute;z-index:4;font-size:clamp(58px,12vw,105px);pointer-events:auto;user-select:none;filter:drop-shadow(0 5px 3px #0006);animation:peek .2s ease-out}
@keyframes peek{from{transform:translateX(60%) scale(.7);opacity:.2}to{transform:none;opacity:1}}
.frontObj{position:absolute;bottom:12%;font-size:clamp(58px,11vw,105px);z-index:12;filter:drop-shadow(0 6px 3px #0004)}
#hud{position:absolute;z-index:30;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:7px;padding:10px 12px;background:linear-gradient(#06101de8,transparent);font-weight:1000;font-size:clamp(14px,4vw,23px);text-shadow:0 2px 3px #000;pointer-events:none}#timer{color:#ffe036}#combo{color:#9aff9e}
.screen{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 35%,#355fa3,#10162c 72%)}.hidden{display:none!important}
h1{font-size:clamp(42px,11vw,88px);margin:0;text-shadow:0 5px #0b0d18,0 0 28px #5ee5ff}.sub{font-size:clamp(17px,4vw,25px);margin:12px 0 28px}
button{border:0;border-radius:18px;padding:17px 32px;font-size:22px;font-weight:1000;background:#ffdd31;color:#16131c;box-shadow:0 7px #9d7600}
#message{position:absolute;z-index:45;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(34px,10vw,72px);font-weight:1000;text-shadow:0 5px 4px #000;pointer-events:none;text-align:center}
.pop{position:fixed;z-index:42;font-size:30px;font-weight:1000;pointer-events:none;text-shadow:0 3px #000;animation:fly .65s forwards}@keyframes fly{to{opacity:0;transform:translateY(-100px) scale(1.4)}}
.puff{position:fixed;z-index:41;pointer-events:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #c8eaff;box-shadow:0 0 8px #fff;animation:puff .5s ease-out forwards}
@keyframes puff{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(2)}}
.starFx{position:fixed;z-index:43;pointer-events:none;font-size:36px;animation:star .45s forwards}@keyframes star{to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(180deg) scale(1.6)}}
#resultScore{font-size:clamp(58px,15vw,108px);font-weight:1000;color:#ffdd31}.note{opacity:.78;font-size:14px;margin-top:23px}
</style></head>
<body><div id="game">
<div id="sky" class="layer"><div class="sun"></div></div>
<div id="clouds" class="layer"></div><div id="hills" class="layer"></div><div id="far" class="layer"></div>
<div class="ground"></div><div class="path"></div><div id="world" class="layer"></div><div id="front" class="layer"></div>
<div id="hud" class="hidden"><div>STAGE 1 🏰</div><div id="score">SCORE 0</div><div id="combo"></div><div id="timer">30.0</div></div><div id="message"></div>
<div id="title" class="screen"><h1>BREAK SHOT</h1><div class="sub">CASTLE POP! 🏰☁️</div><button id="start">GAME START</button><div class="note">お城の窓・門・物陰から飛び出すモンスターをポコッ！<br>⭐は撃たないでね。大きなボスは3発。</div></div>
<div id="result" class="screen hidden"><h1>STAGE CLEAR!</h1><div id="resultScore">0</div><div id="rank" class="sub"></div><button id="retry">もう一度</button></div>
</div>
<script>
const $=q=>document.querySelector(q),world=$("#world"),scoreEl=$("#score"),timerEl=$("#timer"),comboEl=$("#combo"),msg=$("#message");
let score=0,running=false,endAt=0,loop,raf,combo=0,lastHit=0,spots=[],scroll=0,lastFrame=0;
function audio(){return window._a||(window._a=new(AudioContext||webkitAudioContext)())}
function shot(){try{let A=audio(),o=A.createOscillator(),g=A.createGain();o.type="square";o.frequency.setValueAtTime(240,A.currentTime);o.frequency.exponentialRampToValueAtTime(100,A.currentTime+.04);g.gain.setValueAtTime(.035,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+.055);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+.06)}catch(e){}}
function poko(big=false){try{let A=audio(),o=A.createOscillator(),g=A.createGain();o.type="sine";o.frequency.setValueAtTime(big?250:390,A.currentTime);o.frequency.exponentialRampToValueAtTime(big?80:155,A.currentTime+.12);g.gain.setValueAtTime(.13,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+.14);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+.15)}catch(e){}}
function build(){
 $("#clouds").innerHTML="";$("#hills").innerHTML="";$("#far").innerHTML="";world.innerHTML="";$("#front").innerHTML="";spots=[];
 for(let i=0;i<7;i++){let e=document.createElement("div");e.className="cloud";e.textContent="☁️";e.dataset.x=i*27+3;e.style.left=e.dataset.x+"%";e.style.top=(4+(i%3)*10)+"%";$("#clouds").appendChild(e)}
 for(let i=0;i<6;i++){let e=document.createElement("div");e.className="hill";e.dataset.x=i*32-12;e.style.left=e.dataset.x+"%";e.style.height=(18+(i%3)*7)+"%";$("#hills").appendChild(e)}
 for(let i=0;i<7;i++){let e=document.createElement("div");e.className="farCastle";e.dataset.x=i*25-8;e.style.left=e.dataset.x+"%";e.style.height=(25+(i%4)*8)+"%";$("#far").appendChild(e)}
 let configs=[["",0,36,55],["purple",38,30,64],["green",72,38,51],["",113,32,67],["purple",148,40,55]];
 configs.forEach((c,i)=>{
   let b=document.createElement("div");b.className="castle "+c[0];b.dataset.x=c[1];b.style.left=c[1]+"%";b.style.width=c[2]+"%";b.style.height=c[3]+"%";
   b.innerHTML='<div class="battlement"></div><div class="tower l"></div><div class="tower r"></div>';
   for(let r=0;r<2;r++)for(let col=0;col<2;col++){let w=document.createElement("div");w.className="window";w.style.left=(10+col*51)+"%";w.style.top=(15+r*38)+"%";b.appendChild(w);spots.push(w)}
   let d=document.createElement("div");d.className="door";b.appendChild(d);spots.push(d);world.appendChild(b);
 });
 for(let i=0;i<7;i++){let e=document.createElement("div");e.className="frontObj";e.dataset.x=i*30+10;e.style.left=e.dataset.x+"%";e.textContent=i%3===0?"🌳":i%3===1?"🌼":"🪧";$("#front").appendChild(e)}
}
function actor(type){
 let a=document.createElement("div");a.className="actor "+type;a.dataset.type=type;a.dataset.hp=type==="boss"?3:1;
 let normal=["🍄","🐢","🦀"],boss=["🐲","👾"],icon=type==="safe"?"⭐":type==="boss"?boss[Math.floor(Math.random()*boss.length)]:normal[Math.floor(Math.random()*normal.length)];
 a.innerHTML=`<span class="person">${icon}</span>${type==="boss"?'<span class="hp"><i></i></span>':""}`;a.onpointerdown=hit;return a;
}
function spawn(){
 if(!running)return;let free=spots.filter(x=>!x.querySelector(".actor"));if(!free.length)return;
 let sp=free[Math.floor(Math.random()*free.length)],r=Math.random(),type=r<.05?"boss":r<.15?"safe":"bad",a=actor(type);sp.appendChild(a);
 setTimeout(()=>a.isConnected&&a.remove(),type==="boss"?2500:1450);
}
function sideSpawn(){
 if(!running)return;let bs=[...document.querySelectorAll(".castle")];if(!bs.length)return;let b=bs[Math.floor(Math.random()*bs.length)];
 let a=actor("bad");a.className="sideEnemy";a.dataset.type="bad";a.dataset.hp=1;a.textContent=["🍄","🐢","🦀"][Math.floor(Math.random()*3)];a.onpointerdown=hit;
 a.style.left=(b.offsetLeft+b.offsetWidth-30)+"px";a.style.top=(b.offsetTop+b.offsetHeight*(.42+Math.random()*.35))+"px";world.appendChild(a);setTimeout(()=>a.isConnected&&a.remove(),1200);
}
function smoke(e,big=false){
 for(let i=0;i<(big?16:9);i++){let p=document.createElement("i");p.className="puff";p.style.left=(e.clientX-12)+"px";p.style.top=(e.clientY-12)+"px";let a=Math.random()*Math.PI*2,d=25+Math.random()*(big?95:60);p.style.setProperty("--dx",Math.cos(a)*d+"px");p.style.setProperty("--dy",Math.sin(a)*d+"px");document.body.appendChild(p);setTimeout(()=>p.remove(),550)}
 for(let i=0;i<(big?8:4);i++){let st=document.createElement("b");st.className="starFx";st.textContent="✨";st.style.left=e.clientX+"px";st.style.top=e.clientY+"px";st.style.setProperty("--dx",(Math.random()*120-60)+"px");st.style.setProperty("--dy",(Math.random()*100-70)+"px");document.body.appendChild(st);setTimeout(()=>st.remove(),500)}
}
function points(e,t){let p=document.createElement("div");p.className="pop";p.style.left=e.clientX+"px";p.style.top=e.clientY+"px";p.textContent=t;document.body.appendChild(p);setTimeout(()=>p.remove(),700)}
function hit(e){
 if(!running)return;e.stopPropagation();shot();let type=this.dataset.type;
 if(type==="safe"){score=Math.max(0,score-500);combo=0;scoreEl.textContent="SCORE "+score.toLocaleString();comboEl.textContent="⭐ -500";points(e,"-500");poko();this.remove();return}
 let hp=+this.dataset.hp-1;this.dataset.hp=hp;
 if(type==="boss"&&hp>0){this.querySelector(".hp i").style.width=(hp/3*100)+"%";comboEl.textContent="BOSS あと"+hp+"発！";points(e,"HIT!");return}
 let now=performance.now();combo=now-lastHit<850?combo+1:1;lastHit=now;let base=type==="boss"?1500:100,m=Math.min(5,1+Math.floor((combo-1)/5)),pts=base*m;score+=pts;
 scoreEl.textContent="SCORE "+score.toLocaleString();comboEl.textContent=combo>1?combo+" COMBO ×"+m:"";points(e,"+"+pts);smoke(e,type==="boss");poko(type==="boss");this.remove();
}
function start(){
 $("#title").classList.add("hidden");$("#result").classList.add("hidden");$("#hud").classList.remove("hidden");score=combo=scroll=0;scoreEl.textContent="SCORE 0";comboEl.textContent="";build();msg.textContent="STAGE 1";lastFrame=performance.now();
 setTimeout(()=>{msg.textContent="";running=true;endAt=performance.now()+30000;loop=setInterval(()=>{spawn();if(Math.random()<.25)sideSpawn()},380);for(let i=0;i<4;i++)spawn();tick()},850)
}
function move(sel,factor,wrap){
 document.querySelectorAll(sel).forEach(el=>{let base=+el.dataset.x,x=base-scroll*factor;while(x<-45){base+=wrap;el.dataset.x=base;x=base-scroll*factor}el.style.left=x+"%"})
}
function tick(now=performance.now()){
 if(!running)return;let dt=Math.min(40,now-lastFrame);lastFrame=now;scroll+=dt*.018;
 move(".cloud",.10,190);move(".hill",.20,190);move(".farCastle",.34,190);move(".castle",1,190);move(".frontObj",1.55,205);
 let left=Math.max(0,endAt-performance.now());timerEl.textContent=(left/1000).toFixed(1);if(left<=0)return finish();raf=requestAnimationFrame(tick)
}
function finish(){running=false;clearInterval(loop);cancelAnimationFrame(raf);msg.textContent="CLEAR!";poko(true);setTimeout(()=>{msg.textContent="";$("#hud").classList.add("hidden");$("#result").classList.remove("hidden");$("#resultScore").textContent=score.toLocaleString();$("#rank").textContent="RANK "+(score>=14000?"S":score>=9500?"A":score>=5500?"B":"C")},900)}
$("#game").addEventListener("pointerdown",e=>{if(running&&!e.target.closest(".actor")&&!e.target.closest(".sideEnemy")&&!e.target.closest("button"))shot()});
let lastTap=0;function noZoom(e){e.preventDefault()}
["dblclick","gesturestart","gesturechange","gestureend"].forEach(x=>document.addEventListener(x,noZoom,{passive:false}));
document.addEventListener("touchstart",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener("touchend",e=>{let n=Date.now();if(n-lastTap<420)e.preventDefault();lastTap=n},{passive:false});
$("#start").onclick=start;$("#retry").onclick=start;build();
</script></body></html>
