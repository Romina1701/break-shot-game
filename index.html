<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BREAK SHOT - BRICK CASTLE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;background:#57c8ff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:white}
#game{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:linear-gradient(#46c4ff 0 62%,#70dc68 62%)}
.layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#sky{background:linear-gradient(#36b8ff,#dffaff 75%)}
.sun{position:absolute;right:7%;top:8%;width:86px;height:86px;border-radius:50%;background:#fff4a0;box-shadow:0 0 45px #fff5a5}
.cloud{position:absolute;font-size:clamp(55px,11vw,110px);opacity:.82}
.hill{position:absolute;bottom:17%;width:44%;height:24%;border-radius:60% 60% 0 0;background:#49bd66;opacity:.72}
.far{position:absolute;bottom:18%;width:20%;height:35%;background:#9f8be7;border-radius:14px 14px 0 0;opacity:.35}
.ground{position:absolute;bottom:0;left:0;right:0;height:19%;background:linear-gradient(#7be46d,#45b84f);border-top:6px solid #b6f38a}
.path{position:absolute;bottom:0;left:0;right:0;height:10%;background:linear-gradient(#f4d58c,#d9a95f);border-top:5px solid #fff1b1}

/* Main brick castle */
.castle{position:absolute;bottom:17%;z-index:5;width:46%;height:62%;border:5px solid #9b3f38;box-shadow:10px 10px 0 #0002;pointer-events:none;
 background:
 linear-gradient(90deg,transparent 48%,#00000012 49%,transparent 51%),
 linear-gradient(#0000 47%,#00000013 48%,#0000 51%),
 repeating-linear-gradient(0deg,#ef765d 0 25px,#b94e43 26px 29px),
 repeating-linear-gradient(90deg,#ef765d 0 54px,#b94e43 55px 59px)}
.castle.alt{filter:hue-rotate(34deg) saturate(.95)}
.castle.pink{filter:hue-rotate(315deg) saturate(.9)}
.castle:before{content:"";position:absolute;left:-5px;right:-5px;top:-34px;height:38px;
 background:linear-gradient(#ffad6d,#df6552);
 clip-path:polygon(0 100%,0 38%,9% 38%,9% 0,19% 0,19% 38%,31% 38%,31% 0,42% 0,42% 38%,55% 38%,55% 0,66% 0,66% 38%,79% 38%,79% 0,90% 0,90% 38%,100% 38%,100% 100%)}
.tower{position:absolute;bottom:0;width:27%;height:120%;border:5px solid #934037;
 background:repeating-linear-gradient(0deg,#ff8b68 0 24px,#bd5145 25px 29px)}
.tower.l{left:-17%}.tower.r{right:-17%}
.tower:before{content:"";position:absolute;left:-6px;right:-6px;top:-30px;height:34px;background:#ff9d6e;
 clip-path:polygon(0 100%,0 35%,18% 35%,18% 0,39% 0,39% 35%,62% 35%,62% 0,82% 0,82% 35%,100% 35%,100% 100%)}

/* Large brick arch windows */
.window{position:absolute;width:43%;height:34%;pointer-events:auto;overflow:visible}
.window .brickArch{position:absolute;inset:-12px;border-radius:48% 48% 10px 10px;background:
 repeating-conic-gradient(from 225deg at 50% 45%,#ffd077 0 8deg,#a94a3e 8deg 10deg,#f08a5f 10deg 18deg);
 box-shadow:0 5px 0 #84382f,0 8px 10px #0003}
.window .glass{position:absolute;inset:6px;border-radius:43% 43% 5px 5px;background:linear-gradient(#b9efff 0 15%,#4d9fd3 55%,#173d62 100%);border:4px solid #fff1c2;overflow:hidden;box-shadow:inset 0 0 18px #09243c}
.window .glass:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:4px solid #eaf8ff99}
.window .glass:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:4px solid #eaf8ff99}
.door{position:absolute;left:31%;bottom:-2px;width:38%;height:34%;pointer-events:auto;border-radius:52% 52% 0 0;background:linear-gradient(90deg,#4e3261,#271b3d);border:12px solid #ffc66e;box-shadow:0 5px 0 #8d493c,inset 0 0 20px #000}

/* Characters */
.actor{position:absolute;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;user-select:none;pointer-events:auto;animation:rise .18s ease-out}
.person{position:relative;display:block;width:clamp(76px,15vw,136px);height:clamp(70px,14vw,126px);filter:drop-shadow(0 7px 3px #0005)}
.creature{position:absolute;inset:0}
.mush .cap{position:absolute;left:7%;top:3%;width:86%;height:48%;border-radius:52% 52% 36% 36%;background:radial-gradient(circle at 28% 28%,#ffe65d 0 12%,transparent 13%),radial-gradient(circle at 72% 35%,#ffe65d 0 11%,transparent 12%),linear-gradient(#ff765e,#e83d48);border:4px solid #762d3b}
.mush .face{position:absolute;left:22%;top:39%;width:56%;height:45%;border-radius:45%;background:#f7c58a;border:4px solid #713f31}
.mush .eye{position:absolute;top:22%;width:12%;height:28%;background:#20202b;border-radius:50%}.mush .e1{left:25%}.mush .e2{right:25%}
.mush .foot{position:absolute;bottom:1%;width:34%;height:18%;border-radius:50%;background:#713f31}.mush .f1{left:12%}.mush .f2{right:12%}
.turtle .shell{position:absolute;left:12%;top:17%;width:63%;height:61%;border-radius:50%;background:radial-gradient(circle,#ffe66b 0 13%,#5ec75d 14% 38%,#278d55 39% 100%);border:5px solid #246445}
.turtle .head{position:absolute;right:2%;top:8%;width:45%;height:42%;border-radius:48%;background:#f2d765;border:4px solid #6f6831}
.turtle .eye{position:absolute;right:20%;top:23%;width:12%;height:22%;border-radius:50%;background:#20202b}
.turtle .leg{position:absolute;bottom:3%;width:24%;height:25%;border-radius:45%;background:#f2d765;border:3px solid #6f6831}.turtle .l1{left:17%}.turtle .l2{right:14%}
.blob .body{position:absolute;left:8%;top:8%;width:84%;height:76%;border-radius:48% 48% 38% 38%;background:linear-gradient(#8b70ff,#5b49c9);border:5px solid #3b3184}
.blob .horn{position:absolute;top:-6%;width:24%;height:28%;background:#ffe06b;clip-path:polygon(50% 0,100% 100%,0 100%)}.blob .h1{left:12%;transform:rotate(-18deg)}.blob .h2{right:12%;transform:rotate(18deg)}
.blob .eye{position:absolute;top:31%;width:15%;height:20%;border-radius:50%;background:#fff}.blob .e1{left:27%}.blob .e2{right:27%}.blob .eye:after{content:"";position:absolute;inset:28%;border-radius:50%;background:#222}
.blob .mouth{position:absolute;left:34%;bottom:19%;width:32%;height:11%;border-radius:0 0 50% 50%;background:#35213f}
.safeIcon{font-size:clamp(65px,14vw,125px);line-height:1}
.boss .person{transform:scale(1.16);filter:drop-shadow(0 0 12px #ffe34f)}
.hp{position:absolute;top:3px;left:6%;right:6%;height:9px;border:2px solid white;border-radius:6px;background:#4a1010;overflow:hidden}.hp i{display:block;width:100%;height:100%;background:#ff4949}
@keyframes rise{from{transform:translateY(70%) scale(.75);opacity:.4}to{transform:none;opacity:1}}
.sideEnemy{position:absolute;z-index:4;width:clamp(76px,15vw,136px);height:clamp(70px,14vw,126px);pointer-events:auto;user-select:none;filter:drop-shadow(0 7px 4px #0006);animation:peek .2s ease-out}
@keyframes peek{from{transform:translateX(55%) scale(.7);opacity:.2}to{transform:none;opacity:1}}
.front{position:absolute;bottom:11%;z-index:12;font-size:clamp(62px,11vw,105px);filter:drop-shadow(0 6px 4px #0004)}

/* UI */
#hud{position:absolute;z-index:30;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:7px;padding:10px 12px;background:linear-gradient(#06101de8,transparent);font-weight:1000;font-size:clamp(14px,4vw,23px);text-shadow:0 2px 3px #000;pointer-events:none}
#timer{color:#ffe038}#combo{color:#a4ff9c}
.screen{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 35%,#3964aa,#10162c 72%)}
.hidden{display:none!important}h1{font-size:clamp(42px,11vw,88px);margin:0;text-shadow:0 5px #0a0d18,0 0 28px #62e7ff}.sub{font-size:clamp(17px,4vw,25px);margin:12px 0 28px}
button{border:0;border-radius:18px;padding:17px 32px;font-size:22px;font-weight:1000;background:#ffdd31;color:#17131c;box-shadow:0 7px #9e7700}
#message{position:absolute;z-index:45;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(34px,10vw,72px);font-weight:1000;text-shadow:0 5px 4px #000;pointer-events:none}
.pop{position:fixed;z-index:42;font-size:30px;font-weight:1000;pointer-events:none;text-shadow:0 3px #000;animation:fly .65s forwards}@keyframes fly{to{opacity:0;transform:translateY(-100px) scale(1.4)}}
.puff{position:fixed;z-index:41;width:26px;height:26px;border-radius:50%;background:white;border:3px solid #c8ecff;box-shadow:0 0 9px white;pointer-events:none;animation:puff .52s forwards}
@keyframes puff{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(2.2)}}
.spark{position:fixed;z-index:43;font-size:34px;pointer-events:none;animation:spark .45s forwards}@keyframes spark{to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(1.5)}}
#resultScore{font-size:clamp(58px,15vw,108px);font-weight:1000;color:#ffdd31}.note{opacity:.78;font-size:14px;margin-top:23px}
</style>
</head><body>
<div id="game">
<div id="sky" class="layer"><div class="sun"></div></div><div id="clouds" class="layer"></div><div id="hills" class="layer"></div><div id="far" class="layer"></div>
<div class="ground"></div><div class="path"></div><div id="world" class="layer"></div><div id="front" class="layer"></div>
<div id="hud" class="hidden"><div>STAGE 1 🏰</div><div id="score">SCORE 0</div><div id="combo"></div><div id="timer">30.0</div></div><div id="message"></div>
<div id="title" class="screen"><h1>BREAK SHOT</h1><div class="sub">BRICK CASTLE 🏰</div><button id="start">GAME START</button><div class="note">大きなレンガ窓・門・城の物陰からモンスターが登場！<br>⭐は撃たない。ボスは3発でポコッ！</div></div>
<div id="result" class="screen hidden"><h1>STAGE CLEAR!</h1><div id="resultScore">0</div><div id="rank" class="sub"></div><button id="retry">もう一度</button></div>
</div>
<script>
const $=q=>document.querySelector(q),world=$("#world"),scoreEl=$("#score"),timerEl=$("#timer"),comboEl=$("#combo"),msg=$("#message");
let score=0,running=false,endAt=0,loop,raf,combo=0,lastHit=0,spots=[],scroll=0,lastFrame=0;
function A(){return window._a||(window._a=new(AudioContext||webkitAudioContext)())}
function shot(){try{let a=A(),o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.setValueAtTime(220,a.currentTime);o.frequency.exponentialRampToValueAtTime(95,a.currentTime+.045);g.gain.setValueAtTime(.035,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.06);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.065)}catch(e){}}
function poko(big=false){try{let a=A(),o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.setValueAtTime(big?245:390,a.currentTime);o.frequency.exponentialRampToValueAtTime(big?80:150,a.currentTime+.12);g.gain.setValueAtTime(.13,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.145);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.15)}catch(e){}}

let musicTimer=null,musicStep=0;
const melody=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,523.25,659.25,783.99,1046.5,880,783.99,659.25,587.33];
function musicNote(freq,when,dur=.13,vol=.026){
 try{let a=A(),o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(vol,when);g.gain.exponentialRampToValueAtTime(.001,when+dur);o.connect(g);g.connect(a.destination);o.start(when);o.stop(when+dur+.02)}catch(e){}
}
function bassNote(freq,when){
 try{let a=A(),o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=freq;g.gain.setValueAtTime(.012,when);g.gain.exponentialRampToValueAtTime(.001,when+.11);o.connect(g);g.connect(a.destination);o.start(when);o.stop(when+.12)}catch(e){}
}
function startMusic(){
 stopMusic();musicStep=0;
 const play=()=>{if(!running)return;let a=A(),t=a.currentTime+.02,f=melody[musicStep%melody.length];musicNote(f,t);if(musicStep%2===0)bassNote((musicStep%8<4)?130.81:146.83,t);musicStep++;};
 play();musicTimer=setInterval(play,165);
}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}

function build(){
 $("#clouds").innerHTML=$("#hills").innerHTML=$("#far").innerHTML=world.innerHTML=$("#front").innerHTML="";spots=[];
 for(let i=0;i<7;i++){let e=document.createElement("div");e.className="cloud";e.textContent="☁️";e.dataset.x=i*29+2;e.style.left=e.dataset.x+"%";e.style.top=(4+i%3*10)+"%";$("#clouds").appendChild(e)}
 for(let i=0;i<6;i++){let e=document.createElement("div");e.className="hill";e.dataset.x=i*35-15;e.style.left=e.dataset.x+"%";e.style.height=(18+i%3*7)+"%";$("#hills").appendChild(e)}
 for(let i=0;i<7;i++){let e=document.createElement("div");e.className="far";e.dataset.x=i*27-10;e.style.left=e.dataset.x+"%";e.style.height=(26+i%4*8)+"%";$("#far").appendChild(e)}
 [["",0,47,61],["alt",51,43,68],["pink",98,49,57],["",151,45,66]].forEach((c,i)=>{
   let b=document.createElement("div");b.className="castle "+c[0];b.dataset.x=c[1];b.style.left=c[1]+"%";b.style.width=c[2]+"%";b.style.height=c[3]+"%";
   b.innerHTML='<div class="tower l"></div><div class="tower r"></div>';
   [[4,11],[53,11],[4,51],[53,51]].forEach(pos=>{let w=document.createElement("div");w.className="window";w.style.left=pos[0]+"%";w.style.top=pos[1]+"%";w.innerHTML='<div class="brickArch"></div><div class="glass"></div>';b.appendChild(w);spots.push(w.querySelector(".glass"))});
   let d=document.createElement("div");d.className="door";b.appendChild(d);spots.push(d);world.appendChild(b);
 });
 for(let i=0;i<7;i++){let e=document.createElement("div");e.className="front";e.dataset.x=i*31+8;e.style.left=e.dataset.x+"%";e.textContent=i%3===0?"🌳":i%3===1?"🌼":"🪧";$("#front").appendChild(e)}
}
function makeActor(type){
 let a=document.createElement("div");a.className="actor "+type;a.dataset.type=type;a.dataset.hp=type==="boss"?3:1;
 let kind=type==="boss"?"blob":(["mush","turtle"][Math.floor(Math.random()*2)]);
 let art=type==="safe"?'<span class="safeIcon">⭐</span>':
 kind==="mush"?'<span class="person"><i class="creature mush"><i class="cap"></i><i class="face"><i class="eye e1"></i><i class="eye e2"></i></i><i class="foot f1"></i><i class="foot f2"></i></i></span>':
 kind==="turtle"?'<span class="person"><i class="creature turtle"><i class="shell"></i><i class="head"><i class="eye"></i></i><i class="leg l1"></i><i class="leg l2"></i></i></span>':
 '<span class="person"><i class="creature blob"><i class="horn h1"></i><i class="horn h2"></i><i class="body"><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i></i></i></span>';
 a.innerHTML=art+(type==="boss"?'<span class="hp"><i></i></span>':"");a.onpointerdown=hit;return a
}
function spawn(){if(!running)return;let free=spots.filter(x=>!x.querySelector(".actor"));if(!free.length)return;let sp=free[Math.floor(Math.random()*free.length)],r=Math.random(),type=r<.05?"boss":r<.15?"safe":"bad",a=makeActor(type);sp.appendChild(a);setTimeout(()=>a.isConnected&&a.remove(),type==="boss"?2500:1450)}
function sideSpawn(){if(!running)return;let bs=[...document.querySelectorAll(".castle")],b=bs[Math.floor(Math.random()*bs.length)],a=makeActor("bad");a.className="sideEnemy";a.innerHTML=makeActor("bad").innerHTML;a.dataset.type="bad";a.dataset.hp=1;a.onpointerdown=hit;a.style.left=(b.offsetLeft+b.offsetWidth-25)+"px";a.style.top=(b.offsetTop+b.offsetHeight*(.42+Math.random()*.36))+"px";world.appendChild(a);setTimeout(()=>a.isConnected&&a.remove(),1200)}
function smoke(e,big=false){for(let i=0;i<(big?18:10);i++){let p=document.createElement("i");p.className="puff";p.style.left=e.clientX-13+"px";p.style.top=e.clientY-13+"px";let a=Math.random()*Math.PI*2,d=25+Math.random()*(big?100:65);p.style.setProperty("--dx",Math.cos(a)*d+"px");p.style.setProperty("--dy",Math.sin(a)*d+"px");document.body.appendChild(p);setTimeout(()=>p.remove(),570)}for(let i=0;i<(big?8:4);i++){let s=document.createElement("b");s.className="spark";s.textContent="✨";s.style.left=e.clientX+"px";s.style.top=e.clientY+"px";s.style.setProperty("--dx",Math.random()*130-65+"px");s.style.setProperty("--dy",Math.random()*110-80+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),500)}}
function pop(e,t){let p=document.createElement("div");p.className="pop";p.style.left=e.clientX+"px";p.style.top=e.clientY+"px";p.textContent=t;document.body.appendChild(p);setTimeout(()=>p.remove(),700)}
function hit(e){if(!running)return;e.stopPropagation();shot();let type=this.dataset.type;if(type==="safe"){score=Math.max(0,score-500);combo=0;scoreEl.textContent="SCORE "+score.toLocaleString();comboEl.textContent="⭐ -500";pop(e,"-500");poko();this.remove();return}let hp=+this.dataset.hp-1;this.dataset.hp=hp;if(type==="boss"&&hp>0){this.querySelector(".hp i").style.width=hp/3*100+"%";comboEl.textContent="BOSS あと"+hp+"発！";pop(e,"HIT!");return}let now=performance.now();combo=now-lastHit<850?combo+1:1;lastHit=now;let base=type==="boss"?1500:100,m=Math.min(5,1+Math.floor((combo-1)/5)),pts=base*m;score+=pts;scoreEl.textContent="SCORE "+score.toLocaleString();comboEl.textContent=combo>1?combo+" COMBO ×"+m:"";pop(e,"+"+pts);smoke(e,type==="boss");poko(type==="boss");this.remove()}
function start(){ $("#title").classList.add("hidden");$("#result").classList.add("hidden");$("#hud").classList.remove("hidden");score=combo=scroll=0;scoreEl.textContent="SCORE 0";comboEl.textContent="";build();msg.textContent="STAGE 1";lastFrame=performance.now();setTimeout(()=>{msg.textContent="";running=true;startMusic();endAt=performance.now()+30000;loop=setInterval(()=>{spawn();if(Math.random()<.26)sideSpawn()},390);for(let i=0;i<4;i++)spawn();tick()},850)}
function move(sel,f,w){document.querySelectorAll(sel).forEach(el=>{let b=+el.dataset.x,x=b-scroll*f;while(x<-55){b+=w;el.dataset.x=b;x=b-scroll*f}el.style.left=x+"%"})}
function tick(now=performance.now()){if(!running)return;let dt=Math.min(40,now-lastFrame);lastFrame=now;scroll+=dt*.017;move(".cloud",.1,200);move(".hill",.2,200);move(".far",.34,200);move(".castle",1,210);move(".front",1.55,220);let l=Math.max(0,endAt-performance.now());timerEl.textContent=(l/1000).toFixed(1);if(l<=0)return finish();raf=requestAnimationFrame(tick)}
function finish(){running=false;stopMusic();clearInterval(loop);cancelAnimationFrame(raf);msg.textContent="CLEAR!";poko(true);setTimeout(()=>{msg.textContent="";$("#hud").classList.add("hidden");$("#result").classList.remove("hidden");$("#resultScore").textContent=score.toLocaleString();$("#rank").textContent="RANK "+(score>=14000?"S":score>=9500?"A":score>=5500?"B":"C")},900)}
$("#game").addEventListener("pointerdown",e=>{if(running&&!e.target.closest(".actor")&&!e.target.closest(".sideEnemy")&&!e.target.closest("button"))shot()});
let lastTap=0;function nz(e){e.preventDefault()}["dblclick","gesturestart","gesturechange","gestureend"].forEach(x=>document.addEventListener(x,nz,{passive:false}));document.addEventListener("touchstart",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener("touchend",e=>{let n=Date.now();if(n-lastTap<420)e.preventDefault();lastTap=n},{passive:false});
$("#start").onclick=start;$("#retry").onclick=start;build();
</script></body></html>
